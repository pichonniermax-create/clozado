# Les mises à jour de dépendances proposées automatiquement (docs/audit-production-ready.md §5 Q2) :
# une pull request groupée par semaine, que l'intégration continue vérifie avant toute fusion.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
      developpement:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
